[project]
name = "nl2repobench"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python_on_whales",
    "openhands",
    "pydantic",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
